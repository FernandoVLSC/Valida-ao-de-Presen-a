<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Check-in de Eventos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b101b;
    --surface: #161c2d;
    --surface2: #1f293d;
    --border: rgba(255,255,255,0.08);
    --accent: #3bffbb;
    --accent-dim: rgba(59,255,187,0.1);
    --text: #f1f5f9;
    --text2: #94a3b8;
    --danger: #ff5c7c;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 50px; }

  /* HEADER */
  .header { padding: 40px 24px 20px; text-align: left; position: relative; border-bottom: 1px solid var(--border); }
  .header-title { font-family: 'Syne', sans-serif; font-size: 26px; font-weight: 800; }
  .header-event { color: var(--accent); font-size: 14px; font-weight: 600; text-transform: uppercase; margin-top: 4px; }
  
  .admin-trigger { position: absolute; top: 40px; right: 20px; background: none; border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 20px; font-size: 11px; cursor: pointer; }

  /* CONTENT */
  .container { width: 92%; max-width: 450px; margin: 20px auto; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card-label { font-size: 12px; font-weight: 600; color: var(--text2); margin-bottom: 15px; display: block; text-transform: uppercase; }

  /* FORM ELEMENTS */
  .field { margin-bottom: 18px; }
  .field label { display: block; font-size: 13px; color: var(--text2); margin-bottom: 8px; }
  .field input, .field select { 
    width: 100%; background: var(--surface2); border: 1px solid var(--border); 
    padding: 14px; border-radius: 10px; color: #fff; font-size: 15px; outline: none;
  }
  .field input:focus { border-color: var(--accent); }

  /* STATUS GPS */
  .loc-box { display: flex; align-items: center; gap: 12px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 10px; margin-bottom: 15px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #444; }
  .dot.active { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
  .dot.error { background: var(--danger); }

  .btn { width: 100%; padding: 16px; border-radius: 10px; border: none; font-family: 'Syne', sans-serif; font-weight: 700; cursor: pointer; font-size: 15px; transition: 0.2s; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-primary:disabled { opacity: 0.3; filter: grayscale(1); }
  .btn-ghost { background: none; border: 1px solid var(--accent); color: var(--accent); margin-bottom: 10px; }

  /* ADMIN LIST */
  .attendee-item { display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .step { display: none; }
  .step.active { display: block; }
</style>
</head>
<body>

<div class="header">
  <button class="admin-trigger" onclick="abrirAdmin()">Painel Admin</button>
  <div class="header-title" id="displayFaculdade">FATEC</div>
  <div class="header-event" id="displayEvento">Carregando evento...</div>
</div>

<div class="container">
  
  <div id="stepRegistro" class="step active">
    <div class="card">
      <span class="card-label">1. Localização</span>
      <div class="loc-box">
        <div id="locDot" class="dot"></div>
        <div id="locText" style="font-size: 13px;">GPS pendente...</div>
      </div>
      <button class="btn btn-ghost" id="btnGps" onclick="validarGps()">Validar Localização</button>
    </div>

    <div class="card">
      <span class="card-label">2. Identificação</span>
      <div class="field">
        <label>Nome Completo</label>
        <input type="text" id="nome" placeholder="Seu nome aqui">
      </div>
      <div class="field">
        <label>Curso</label>
        <select id="curso">
          <option value="">Selecione seu curso</option>
          <option value="GTI">Gestão da Tecnologia da Informação (GTI)</option>
          <option value="GCOM">Gestão Comercial (GCOM)</option>
        </select>
      </div>
      <button class="btn btn-primary" id="btnConfirmar" disabled onclick="enviarPresenca()">Confirmar Presença</button>
    </div>
  </div>

  <div id="stepSucesso" class="step">
    <div class="card" style="text-align: center; padding: 40px 20px;">
      <h2 style="color: var(--accent); margin-bottom: 10px;">Presença Confirmada!</h2>
      <p id="msgSucesso" style="font-size: 14px; color: var(--text2);"></p>
      <button class="btn btn-ghost" style="margin-top: 20px;" onclick="location.reload()">Novo Registro</button>
    </div>
  </div>

  <div id="stepAdmin" class="step">
    <div class="card">
      <h3 style="margin-bottom: 15px;">Presenças Registradas</h3>
      <div id="listaPresencas" style="max-height: 300px; overflow-y: auto;"></div>
      <div style="margin-top: 20px; display: flex; gap: 10px;">
        <button class="btn btn-primary" style="font-size: 12px; padding: 10px;" onclick="exportarCSV()">Exportar CSV</button>
        <button class="btn btn-ghost" style="font-size: 12px; padding: 10px; border-color: var(--danger); color: var(--danger);" onclick="limparDados()">Limpar Tudo</button>
      </div>
      <button class="btn btn-ghost" style="margin-top: 15px;" onclick="mostrarStep('stepRegistro')">Sair do Painel</button>
    </div>
  </div>
</div>

<script>
const CONFIG = {
  nomeFaculdade: "FATEC",
  nomeEvento: "Palestra de Inovação 2026",
  senhaAdmin: "Fatec@2026",
  // Coordenadas Alvo (Exemplo: Fatec)
  latAlvo: -22.6534596030525,
  lngAlvo: -50.441987270622306,
  raioPermitido: 1000 // metros (ajustado para 1km para maior tolerância em testes)
};

let gpsValidado = false;

function init() {
  document.getElementById('displayFaculdade').textContent = CONFIG.nomeFaculdade;
  document.getElementById('displayEvento').textContent = CONFIG.nomeEvento;
  
  // Monitorar campos para habilitar botão
  const inputs = ['nome', 'curso'];
  inputs.forEach(id => {
    document.getElementById(id).addEventListener('change', validarFormulario);
    document.getElementById(id).addEventListener('keyup', validarFormulario);
  });
}

function validarGps() {
  const dot = document.getElementById('locDot');
  const txt = document.getElementById('locText');
  
  if (!navigator.geolocation) {
    txt.textContent = "GPS não suportado.";
    return;
  }

  txt.textContent = "Obtendo sinal...";
  
  navigator.geolocation.getCurrentPosition((pos) => {
    const dist = calcularDistancia(pos.coords.latitude, pos.coords.longitude, CONFIG.latAlvo, CONFIG.lngAlvo);
    
    if (dist <= CONFIG.raioPermitido) {
      gpsValidado = true;
      dot.className = "dot active";
      txt.textContent = `Localizado! (Distância: ${Math.round(dist)}m)`;
      document.getElementById('btnGps').style.display = 'none';
      validarFormulario();
    } else {
      dot.className = "dot error";
      txt.textContent = `Fora do local (${Math.round(dist)}m).`;
    }
  }, (err) => {
    txt.textContent = "Erro ao acessar GPS. Verifique as permissões.";
  }, { enableHighAccuracy: true, timeout: 15000 });
}

function calcularDistancia(lat1, lon1, lat2, lon2) {
  const R = 6371e3; 
  const φ1 = lat1 * Math.PI/180;
  const φ2 = lat2 * Math.PI/180;
  const Δφ = (lat2-lat1) * Math.PI/180;
  const Δλ = (lon2-lon1) * Math.PI/180;
  const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) + Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function validarFormulario() {
  const nome = document.getElementById('nome').value.length > 3;
  const curso = document.getElementById('curso').value !== "";
  document.getElementById('btnConfirmar').disabled = !(nome && curso && gpsValidado);
}

function enviarPresenca() {
  const registro = {
    nome: document.getElementById('nome').value,
    curso: document.getElementById('curso').value,
    hora: new Date().toLocaleTimeString()
  };
  
  let lista = JSON.parse(localStorage.getItem('event_presencas') || "[]");
  lista.push(registro);
  localStorage.setItem('event_presencas', JSON.stringify(lista));
  
  document.getElementById('msgSucesso').textContent = `${registro.nome}, sua presença no curso de ${registro.curso} foi salva.`;
  mostrarStep('stepSucesso');
}

function abrirAdmin() {
  const senha = prompt("Digite a senha administrativa:");
  if (senha === CONFIG.senhaAdmin) {
    renderAdmin();
    mostrarStep('stepAdmin');
  } else {
    alert("Senha incorreta.");
  }
}

function renderAdmin() {
  const lista = JSON.parse(localStorage.getItem('event_presencas') || "[]");
  const container = document.getElementById('listaPresencas');
  container.innerHTML = lista.map(p => `
    <div class="attendee-item">
      <div><strong>${p.nome}</strong><br><small>${p.curso}</small></div>
      <div style="color: var(--accent); font-size: 12px;">${p.hora}</div>
    </div>
  `).join('') || "<p style='color: #666;'>Nenhum registro.</p>";
}

function exportarCSV() {
  const lista = JSON.parse(localStorage.getItem('event_presencas') || "[]");
  if (lista.length === 0) return alert("Lista vazia.");
  
  let csv = "Nome;Curso;Hora\n";
  lista.forEach(p => csv += `${p.nome};${p.curso};${p.hora}\n`);
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.setAttribute('href', url);
  a.setAttribute('download', 'presencas.csv');
  a.click();
}

function limparDados() {
  if (confirm("Deseja apagar todos os registros?")) {
    localStorage.removeItem('event_presencas');
    renderAdmin();
  }
}

function mostrarStep(id) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

window.onload = init;
</script>
</body>
</html>
